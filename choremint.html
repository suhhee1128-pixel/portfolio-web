<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choremint - UX/UI Project</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .choremint-page {
            width: 100%;
            min-height: 100vh;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .choremint-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
        }

        .back-link {
            font-family: 'Archivo', sans-serif;
            font-size: 16px;
            color: #000;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .choremint-content {
            padding-top: 80px;
            width: 100%;
            min-height: 100vh;
            margin: 0;
        }

        .svg-container {
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 0;
            margin: 0;
            background-color: #ffffff;
        }

        .svg-viewer {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
        }

        @media (max-width: 768px) {
            .choremint-nav {
                padding: 15px 20px;
            }

            .choremint-content {
                padding-top: 60px;
            }

            .svg-container {
                padding: 0;
            }
        }
    </style>
</head>
<body>
    <div class="choremint-page">
        <!-- Navigation -->
        <nav class="choremint-nav">
            <a href="index.html#projects" class="back-link">← Back to Portfolio</a>
        </nav>

        <!-- SVG Content -->
        <div class="choremint-content">
            <div class="svg-container">
                <img src="images/choremint_real.png" alt="Choremint Project" class="svg-viewer" />
            </div>
        </div>
    </div>
</body>
</html>
