<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume - Seohee Kim</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #ffffff;
            color: #000000;
            line-height: 1.6;
        }

        .resume-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 80px 20px 40px 20px;
        }

        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            font-family: 'Inter', sans-serif;
            font-size: 20px;
            color: #000;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .resume-content {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .resume-image-container {
            width: 100%;
            background-color: #f5f5f5;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .resume-image {
            width: 100%;
            height: auto;
            display: block;
        }

        @media (max-width: 768px) {
            .resume-container {
                padding: 60px 15px 30px 15px;
            }

            .back-link {
                font-size: 18px;
                top: 15px;
                left: 15px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">← Back to Portfolio</a>
    
    <div class="resume-container">
        <div class="resume-content">
            <div class="resume-image-container">
                <img src="images/common/Resume_Seohee Kim.svg" alt="Resume - Seohee Kim" class="resume-image" />
            </div>
        </div>
    </div>
</body>
</html>
