<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wally - AI Wallet Bestie</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .wally-page {
            width: 100%;
            min-height: 100vh;
            background-color: #ffffff;
            margin: 0;
            padding: 0;
        }

        .wally-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            padding: 20px 40px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(99, 99, 99, 0.1);
        }

        .back-link {
            font-family: 'Archivo', sans-serif;
            font-size: 16px;
            color: #000;
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .back-link:hover {
            opacity: 0.7;
        }

        .wally-content {
            padding-top: 80px;
            width: 100%;
            margin: 0;
        }

        .wally-image-container {
            width: 100%;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 0;
            margin: 0;
            background-color: #ffffff;
        }

        .wally-image {
            width: 100%;
            height: auto;
            display: block;
            margin: 0;
            padding: 0;
        }

        .wally-link-button {
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 15px 25px;
            gap: 10px;
            position: absolute;
            width: 241px;
            height: 55px;
            left: 100px;
            top: 459px;
            background: rgba(255, 255, 255, 0.5);
            border: 0.5px solid #4ACC80;
            box-shadow: 0px 0px 48.2px rgba(74, 204, 128, 0.15);
            border-radius: 46px;
            z-index: 100;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .wally-link-button:hover {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0px 0px 48.2px rgba(74, 204, 128, 0.25);
            transform: scale(1.02);
        }

        .wally-image-container {
            position: relative;
        }

        /* Thanks Section */
        .thanks-section {
            width: 100%;
            padding: 0 40px 100px 40px;
            background: linear-gradient(90deg, rgba(224, 255, 211, 0.3) 0%, rgba(255, 182, 193, 0.3) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .thanks-title {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 64px;
            color: #000;
            text-align: center;
            line-height: 1.2;
        }

        .thanks-emojis {
            display: flex;
            gap: 30px;
            align-items: center;
            justify-content: center;
        }

        .emoji-circle {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        .emoji-green {
            background-color: #4ACC80;
        }

        .emoji-pink {
            background-color: #FFB6C1;
        }

        .emoji-blue {
            background-color: #87CEEB;
        }

        .thanks-link-button {
            box-sizing: border-box;
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            padding: 15px 25px;
            gap: 10px;
            width: 241px;
            height: 55px;
            background: rgba(255, 255, 255, 0.5);
            border: 0.5px solid #4ACC80;
            box-shadow: 0px 0px 48.2px rgba(74, 204, 128, 0.15);
            border-radius: 46px;
            text-decoration: none;
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: #000;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .thanks-link-button:hover {
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0px 0px 48.2px rgba(74, 204, 128, 0.25);
            transform: scale(1.02);
        }

        /* Video Section */
        .video-section {
            width: 100%;
            padding: 0 40px 100px 40px;
            background-color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .video-header {
            font-family: 'Orbitron', sans-serif;
            font-weight: 700;
            font-size: 48px;
            color: #000;
            text-align: center;
        }

        .video-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .wally-video {
            width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0px 8px 32px rgba(0, 0, 0, 0.1);
        }

        @media (max-width: 768px) {
            .wally-nav {
                padding: 15px 20px;
            }

            .wally-content {
                padding-top: 60px;
            }

            .wally-link-button {
                top: 80px;
                left: 20px;
                width: 200px;
                height: 48px;
                padding: 12px 20px;
                font-size: 16px;
                border-radius: 40px;
            }

            .thanks-section {
                padding: 0 20px 60px 20px;
                gap: 30px;
            }

            .thanks-title {
                font-size: 40px;
            }

            .emoji-circle {
                width: 60px;
                height: 60px;
                font-size: 40px;
            }

            .thanks-emojis {
                gap: 20px;
            }

            .thanks-link-button {
                width: 200px;
                height: 48px;
                padding: 12px 20px;
                font-size: 16px;
            }

            .video-section {
                padding: 0 20px 60px 20px;
                gap: 30px;
            }

            .video-header {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="wally-page">
        <!-- Navigation -->
        <nav class="wally-nav">
            <a href="index.html#projects" class="back-link">← Back to Portfolio</a>
        </nav>

        <!-- Wally Image -->
        <div class="wally-content">
            <div class="wally-image-container">
                <a href="https://wally3v2.vercel.app/" target="_blank" class="wally-link-button">
                    🔗 View Live Site
                </a>
                <img src="images/wallyfinal.png" alt="Wally Project" class="wally-image" />
            </div>
                    </div>

        <!-- Video Section -->
        <section class="video-section">
            <h2 class="video-header">DEMO</h2>
            <div class="video-container">
                <video class="wally-video" controls autoplay muted loop>
                    <source src="images/fullstack 최.mov" type="video/quicktime">
                    <source src="images/fullstack 최.mov" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
        </section>

        <!-- Thanks Section -->
        <section class="thanks-section">
            <h2 class="thanks-title">Thanks For Watching!</h2>
            <div class="thanks-emojis">
                <div class="emoji-circle emoji-green">😊</div>
                <div class="emoji-circle emoji-pink">😢</div>
                <div class="emoji-circle emoji-blue">😰</div>
            </div>
            <a href="https://wally3v2.vercel.app/" target="_blank" class="thanks-link-button">
                🔗 View Live Site
            </a>
        </section>
    </div>
</body>
</html>
